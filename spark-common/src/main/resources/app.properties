# ============================================================================
# Spark Project - 默认配置文件
# 配置优先级：命令行参数 > 外部文件 > classpath:app.properties > 代码默认值
# ============================================================================

# ========== 基础配置 ==========
spark.app.name=SparkApp
spark.local=true
spark.hive.enabled=false

# ========== 全局并行度 ==========
spark.default.parallelism=200
spark.sql.shuffle.partitions=200

# ========== Driver 配置 ==========
spark.driver.memory=1g
spark.driver.cores=1
spark.driver.memoryOverhead=256m

# ========== Executor 配置 ==========
spark.executor.memory=2g
spark.executor.cores=1
spark.executor.instances=1
spark.executor.memoryOverhead=512m

# ========== 内存管理 ==========
spark.memory.fraction=0.6
spark.memory.storageFraction=0.5

# ========== 网络与重试 ==========
spark.task.maxFailures=4
spark.network.timeout=600s
spark.executor.heartbeatInterval=60s

# ========== 序列化 ==========
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=512m
spark.kryoserializer.buffer=64k

# ========== 压缩 ==========
spark.shuffle.compress=true
spark.shuffle.spill.compress=true
spark.io.compression.codec=snappy
spark.rdd.compress=true
spark.broadcast.compress=true

# ========== JVM 选项 ==========
spark.driver.extraJavaOptions=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/dump
spark.executor.extraJavaOptions=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/dump

# ========== 动态资源分配 ==========
spark.dynamicAllocation.enabled=false
spark.dynamicAllocation.minExecutors=2
spark.dynamicAllocation.maxExecutors=20
spark.dynamicAllocation.initialExecutors=2
spark.dynamicAllocation.executorIdleTimeout=60s

# ========== Hive 集成 ==========
spark.sql.warehouse.dir=/user/hive/warehouse
spark.sql.catalogImplementation=hive
# hive.metastore.uris=thrift://localhost:9083

# ========== 推测执行 ==========
spark.speculation=false
spark.speculation.quantile=0.75

# ========== 自适应查询（AQE, Spark 3+） ==========
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.initialPartitionNum=200

# ========== 日志与事件 ==========
spark.eventLog.enabled=false
spark.eventLog.dir=/tmp/spark-events
spark.log.level=WARN

# ========== 数据源连接配置 ==========
# Redis
datasource.redis.host=localhost
datasource.redis.port=6379
datasource.redis.db=0
datasource.redis.auth=redis123

# Redis 连接池配置
redis.pool.maxTotal=8
redis.pool.maxIdle=8
redis.pool.minIdle=2
redis.pool.maxWaitMs=2000
redis.pool.testOnBorrow=true
redis.scan.threshold=10000

# Kafka
datasource.kafka.bootstrap.servers=localhost:9092
datasource.kafka.group.id=spark-datasource-group

# MongoDB
datasource.mongo.uri=mongodb://localhost:27017
# datasource.mongo.database=

# Elasticsearch
datasource.es.hosts=localhost
datasource.es.port=9200
datasource.es.index.auto.create=true

# ClickHouse
datasource.ck.hosts=jdbc:clickhouse://localhost:8123
datasource.ck.username=default
datasource.ck.password=ck123
datasource.ck.batch.size=10000

# MySQL
datasource.mysql.url=jdbc:mysql://localhost:3307/spark_test?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
datasource.mysql.username=root
datasource.mysql.password=root123
datasource.mysql.driver=com.mysql.cj.jdbc.Driver
datasource.mysql.batch.size=5000

# Doris (Apache Doris)
datasource.doris.url=jdbc:mysql://localhost:9030
datasource.doris.username=root
# datasource.doris.password=
datasource.doris.driver=com.mysql.cj.jdbc.Driver
datasource.doris.batch.size=10000
datasource.doris.query.port=9030
datasource.doris.fenodes=172.20.80.2:8030
datasource.doris.sink.enable-2pc=true
datasource.doris.sink.label-prefix=spark_doris
datasource.doris.sink.max-retries=3
datasource.doris.sink.batch.size=10000
datasource.doris.sink.batch.interval.ms=3000
datasource.doris.request.retries=3
datasource.doris.request.connect.timeout.ms=30000
datasource.doris.request.read.timeout.ms=60000
