name: doris-cluster
services:
  doris-fe:
    image: apache/doris:fe-4.1.1
    container_name: doris-fe
    hostname: doris-fe
    ports:
      - "8030:8030"
      - "9030:9030"
      - "9010:9010"
    environment:
      - FE_MASTER_IP=172.20.0.2
      - FE_MASTER_PORT=9010
      - FE_CURRENT_IP=172.20.0.2
      - FE_CURRENT_PORT=9010
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris-net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8030/api/bootstrap"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  doris-be:
    image: apache/doris:be-4.1.1
    container_name: doris-be
    hostname: doris-be
    ports:
      - "8040:8040"
    environment:
      - FE_MASTER_IP=172.20.0.2
      - BE_IP=172.20.0.3
      - BE_PORT=9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 172.20.0.3
    depends_on:
      doris-fe:
        condition: service_healthy

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
