name: doris-cluster

services:
  doris-fe:
    image: apache/doris:fe-4.1.1
    container_name: doris-fe
    hostname: doris-fe
    mem_limit: 2g
    ports:
      - "8030:8030"
      - "9030:9030"
      - "9010:9010"
    environment:
      - FE_MASTER_IP=172.20.80.2
      - FE_MASTER_PORT=9010
      - FE_CURRENT_IP=172.20.80.2
      - FE_CURRENT_PORT=9010
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
      - ./fe.conf:/opt/apache-doris/fe/conf/fe.conf
    networks:
      doris-net:
        ipv4_address: 172.20.80.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8030/api/bootstrap"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  doris-be:
    image: apache/doris:be-4.1.1
    container_name: doris-be
    hostname: doris-be
    mem_limit: 2g
    ports:
      - "8040:8040"
    environment:
      - FE_MASTER_IP=172.20.80.2
      - BE_IP=172.20.80.3
      - BE_PORT=9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-net:
        ipv4_address: 172.20.80.3
    depends_on:
      doris-fe:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    mem_limit: 512m
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=spark_test
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      doris-net:
        ipv4_address: 172.20.80.4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis-node1:
    image: redis:7-alpine
    container_name: redis-node1
    mem_limit: 128m
    ports:
      - "6379:6379"
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass redis123 --masterauth redis123
    networks:
      doris-net:
        ipv4_address: 172.20.80.6

  redis-node2:
    image: redis:7-alpine
    container_name: redis-node2
    mem_limit: 128m
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass redis123 --masterauth redis123
    networks:
      doris-net:
        ipv4_address: 172.20.80.7

  redis-node3:
    image: redis:7-alpine
    container_name: redis-node3
    mem_limit: 128m
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass redis123 --masterauth redis123
    networks:
      doris-net:
        ipv4_address: 172.20.80.8

  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    mem_limit: 64m
    depends_on:
      - redis-node1
      - redis-node2
      - redis-node3
    entrypoint: |
      sh -c '
        echo "Waiting for nodes..."
        sleep 8
        echo "Creating cluster (3 masters)..."
        echo "yes" | redis-cli -a redis123 --cluster create           172.20.80.6:6379 172.20.80.7:6379 172.20.80.8:6379           --cluster-replicas 0
        echo "Cluster created"
      '
    networks:
      doris-net:
        ipv4_address: 172.20.80.9

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    hostname: clickhouse
    mem_limit: 1g
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=ck123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-log:/var/log/clickhouse-server
    networks:
      doris-net:
        ipv4_address: 172.20.80.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
  mysql-data:
  clickhouse-data:
  clickhouse-log:

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.80.0/24
