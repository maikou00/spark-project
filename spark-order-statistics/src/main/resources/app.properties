# ============================================================================
# Order Statistics - 默认配置文件
# ============================================================================

# 基础配置
spark.app.name=OrderStatistics
spark.local=true
spark.hive.enabled=true

# Hive 本地运行（Derby Metastore）
spark.sql.warehouse.dir=/tmp/spark-warehouse/order-statistics
spark.sql.catalogImplementation=hive

# 日志级别
spark.log.level=WARN

# 并行度
spark.default.parallelism=4
spark.sql.shuffle.partitions=4

# Driver/Executor
spark.driver.memory=1g
spark.executor.memory=2g
spark.executor.instances=1

# 序列化
spark.serializer=org.apache.spark.serializer.KryoSerializer

# AQE
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.initialPartitionNum=4
